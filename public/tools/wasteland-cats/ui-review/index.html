<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>废土喵车队 · 全流程 UI</title><style>*{box-sizing:border-box}body{margin:0;background:#182420;color:#eee9dc;font:16px/1.6 system-ui}header,main{max-width:1280px;margin:auto;padding:24px}header{border-bottom:1px solid #45554b}h1{font-size:28px;margin:0}p{color:#b8c4b7;margin:8px 0}a{color:#e4b776}nav{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:20px}select,button{font:inherit;padding:10px 14px;border:0;background:#eee9dc;color:#182420;border-radius:3px;min-height:46px}select{max-width:100%}button{cursor:pointer}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #dc985e;outline-offset:3px}figure{margin:0;text-align:center}img{display:block;max-width:100%;height:auto;margin:0 auto;image-rendering:pixelated}figcaption{margin-top:14px;color:#b8c4b7}footer{padding:24px;text-align:center;color:#b8c4b7;font-size:13px}</style><header><h1>废土喵车队 · 全流程 UI</h1><p>原生游戏实机截图。切换页面与尺寸，查看每个界面的布局。</p><a href="../">进入可玩预览 →</a><nav><label>界面 <select id="page"></select></label><label>尺寸 <select id="width"><option value="1280">桌面</option><option value="390">手机 390px</option></select></label><button id="previous" aria-label="上一个界面">←</button><button id="next" aria-label="下一个界面">→</button><a id="original" target="_blank">查看原图</a></nav></header><main><figure><img id="preview" alt=""><figcaption id="caption"></figcaption></figure></main><footer>本地审阅版 · 商店三件陈列、锁定与递增刷新；桌面与手机分别布局。</footer><script>const pages={"title": "首页", "garage_hub": "车库基地", "identity": "驾驶员", "chassis": "车体选择", "records": "战绩", "assembly": "组装台", "storage": "零件仓库", "research": "研究台", "expedition_map": "地图选择", "run": "战斗 HUD", "reward": "奖励三选一", "shop": "补给商店", "workshop": "局内整备", "victory": "撤离结算", "defeat": "战败结算", "pause": "暂停", "settings": "设置", "tutorial": "教程", "save_error": "保存失败提示", "boss_training": "Boss 训练", "garage": "旧版兼容车库"};const page=document.querySelector('#page'),width=document.querySelector('#width'),img=document.querySelector('#preview');for(const [id,name]of Object.entries(pages))page.add(new Option(name,id));function show(){const file=page.value+'-'+width.value+'.png';img.src=file;img.alt=pages[page.value]+' · '+width.selectedOptions[0].text;document.querySelector('#caption').textContent=img.alt;document.querySelector('#original').href=file;history.replaceState(null,'','#'+page.value)}page.onchange=width.onchange=show;document.querySelector('#previous').onclick=()=>{page.selectedIndex=(page.selectedIndex+page.length-1)%page.length;show()};document.querySelector('#next').onclick=()=>{page.selectedIndex=(page.selectedIndex+1)%page.length;show()};const initial=location.hash.slice(1);if(pages[initial])page.value=initial;show();</script></html>
