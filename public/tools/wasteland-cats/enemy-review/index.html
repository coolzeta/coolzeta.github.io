<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>改造物种暴动 · 动画图鉴</title><style>
*{box-sizing:border-box}body{margin:0;background:#202b2e;color:#e5d7b9;font:16px system-ui,sans-serif}header{padding:32px 5vw 20px;max-width:980px}h1{font-size:28px}p{line-height:1.7;color:#b9b5a8}nav{position:sticky;top:0;background:#202b2ef2;padding:12px 5vw;z-index:2;display:flex;gap:8px;flex-wrap:wrap}button,select{font:inherit;background:#344447;color:inherit;border:0;padding:8px 14px;border-radius:3px}button[aria-pressed=true]{background:#c99948;color:#202b2e}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(248px,1fr));gap:24px;padding:12px 5vw 64px}article{min-width:0;max-width:100%;overflow-x:auto;border-bottom:1px solid #445353;padding-bottom:22px}canvas{width:224px;height:160px;image-rendering:pixelated;display:block;margin:auto}h2{font-size:17px;margin:2px 0 8px}small{color:#aeb7ae}.part{vertical-align:middle;image-rendering:pixelated;width:24px;height:24px;margin-right:8px}.zoom canvas{width:448px;height:320px}.zoom{grid-template-columns:repeat(auto-fit,minmax(min(100%,448px),1fr))}a{color:#ecc16e}footer{padding:24px 5vw}</style>
<header><a href="../">← 回到游戏</a><h1>改造物种暴动</h1><p>旧世界把动物改造成搬运、拆解、过滤、焊接和勘探工具。控制失效后，它们带着身上的装置夺回了领地。<br>28 种主敌人 + 4 种召唤生物。下方显示游戏实际使用的像素帧；机械碎件用于局内购买，完整武器仍为低概率奖励。</p></header>
<nav id="controls"><button data-state="idle">待机</button><button data-state="move" aria-pressed="true">移动</button><button data-state="attack">攻击</button><button data-state="hit">受击</button><button data-state="death">倒下</button><button id="pause">暂停</button><button id="zoom">2× 查看</button><select id="region"><option value="all">所有地区</option><option value="scrap">废车边境</option><option value="sewer">下水城</option><option value="factory">机械厂</option><option value="desert">黑沙堡</option></select></nav><main id="grid"></main><footer>独立绘制的身体与装置，统一低机位 3/4 侧视角。非循环动作在图鉴中间隔重播；游戏内由战斗事件触发。</footer>
<script>
const stats={idle:[6,8],move:[12,16],attack:[10,12],hit:[4,12],death:[8,10]},roles={chaser:'追击',brute:'冲击',shooter:'远程',bomber:'过载',support:'支援',summoner:'召唤',boss:'首领'};
let state='move',time=0,last=performance.now(),paused=false;const cards=[];
fetch('roster.json').then(r=>r.json()).then(roster=>{for(const v of roster){let a=document.createElement('article');a.dataset.region=v.region;a.innerHTML='<canvas width="224" height="160"></canvas><h2>'+v.name+'</h2><small><img class="part" src="'+v.salvage+'.png">'+roles[v.role]+' · '+({spring:'弹簧',piston:'活塞',fastener:'铆钉',fuse:'保险芯',speaker:'扬声器',latch:'锁扣',servo:'伺服机构',seal:'密封圈',valve:'阀门',pump:'泵芯',tank:'气罐',needle:'针管',tube:'孵化管',impeller:'叶轮',coil:'线圈',fork:'叉齿',nozzle:'焊嘴',capacitor:'电容',spool:'线轴',bearing:'轴承',reactor:'反应芯',cable:'线缆',drill:'钻头',lens:'透镜',primer:'引爆芯',resonator:'共鸣管',filter:'滤芯',armor:'装甲片'}[v.salvage])+'</small>';grid.append(a);let images={};for(let s in stats){images[s]=new Image();images[s].src=v.id+'/'+s+'.png'}cards.push({a,ctx:a.querySelector('canvas').getContext('2d'),images});}});
function tick(now){if(!paused)time+=(now-last)/1000;last=now;let[n,fps]=stats[state],raw=Math.floor(time*fps),frame=['idle','move'].includes(state)?raw%n:Math.min(raw%(n+10),n-1);for(let c of cards){if(c.a.hidden)continue;let im=c.images[state];c.ctx.clearRect(0,0,224,160);if(im.complete&&im.naturalWidth)c.ctx.drawImage(im,frame%8*224,Math.floor(frame/8)*224+64,224,160,0,0,224,160);}requestAnimationFrame(tick)}requestAnimationFrame(tick);
for(let b of document.querySelectorAll('[data-state]'))b.onclick=()=>{state=b.dataset.state;time=0;for(let x of document.querySelectorAll('[data-state]'))x.setAttribute('aria-pressed',x===b)};
document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'播放':'暂停'};document.querySelector('#zoom').onclick=()=>grid.classList.toggle('zoom');document.querySelector('#region').onchange=e=>{for(let c of cards)c.a.hidden=e.target.value!=='all'&&c.a.dataset.region!==e.target.value};
</script>
