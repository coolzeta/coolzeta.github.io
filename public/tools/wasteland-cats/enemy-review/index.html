<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>改造怪物图鉴 · 废土喵车队</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#1d272b;color:#e7dfce;font:15px system-ui,-apple-system,"PingFang SC",sans-serif}header{padding:30px 5vw 16px;max-width:1000px}h1{font-size:30px;margin:14px 0}p{color:#afbab6;line-height:1.8}a{color:#d9b76d}nav{position:sticky;top:0;z-index:2;background:#1d272bf5;border-bottom:1px solid #465051;padding:12px 5vw;display:flex;gap:8px;flex-wrap:wrap}button,select{font:inherit;background:#344347;color:#e7dfce;padding:9px 12px;border:0;border-radius:4px}button{cursor:pointer}button[aria-pressed=true]{background:#c5a15d;color:#192225}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:24px;padding:24px 5vw 50px}article{min-width:0;max-width:100%;border-bottom:1px solid #465051;padding-bottom:22px}article[hidden]{display:none}.stage{display:flex;align-items:flex-end;overflow:auto;background:#293638;min-height:276px}canvas{image-rendering:pixelated;margin:auto;flex:none;display:block}h2{font-size:20px;margin:14px 0 6px}.details{color:#aeb6b0;font-size:13px;line-height:1.8}.part{width:24px;height:24px;image-rendering:pixelated;vertical-align:middle;margin-right:6px}.boss .tag{color:#e9b34f}.tag{font-size:12px;color:#99aeb0;letter-spacing:1px}footer{padding:0 5vw 40px;color:#aeb6b0;line-height:1.8}#error{color:#ffa481}body[data-view="boss"] main{grid-template-columns:repeat(auto-fit,minmax(min(100%,390px),1fr))}@media(max-width:500px){header{padding-top:20px}h1{font-size:26px}nav{gap:6px}button,select{padding:8px 10px}}
</style>
<header><a href="../">← 返回游戏</a><h1>改造怪物暴动</h1><p>完整皮甲、夸张体态与旧工业机关。四位区域首领拥有独立轮廓和强化阶段外观。<br>下方播放游戏实际使用的像素动画；攻击与倒下在图鉴里间隔重播，游戏中由事件触发。</p><p id="summary"></p><p id="error" role="alert"></p></header>
<nav><button data-state="idle">待机</button><button data-state="move" aria-pressed="true">移动</button><button data-state="attack">攻击</button><button data-state="hit">受击</button><button data-state="death">倒下</button><button id="pause">暂停</button><select id="view" aria-label="显示类型"><option value="all">全部怪物</option><option value="boss">仅 Boss</option><option value="normal">普通与召唤物</option></select><select id="region" aria-label="地区"><option value="all">所有地区</option><option value="scrap">废车边境</option><option value="sewer">下水城</option><option value="factory">机械厂</option><option value="desert">黑沙堡</option></select><select id="phase" aria-label="Boss 阶段"><option value="1">Boss · 初始</option><option value="2">Boss · 强化</option></select><select id="zoom" aria-label="显示比例"><option value="game">游戏比例</option><option value="1">原生 1×</option><option value="2">放大 2×</option></select></nav>
<main id="grid"></main><footer>28 种区域敌人 + 4 种召唤物。每种均有待机、移动、攻击、受击与倒下动画；Boss 的强化机关在移动、受击和倒下时也保持一致。<br>机械零件对应怪物身上的装置，完整武器掉落与局内商店规则保持原有配置。</footer>
<script>
const cards=[],roles={chaser:'追击',brute:'冲击',shooter:'远程',bomber:'过载',support:'支援',summoner:'召唤',boss:'区域首领'},regions={scrap:'废车边境',sewer:'下水城',factory:'机械厂',desert:'黑沙堡'},variants={idle:'enraged',move:'move_enraged',attack:'attack_enraged',hit:'hit_enraged',death:'death_enraged'};
let state='move',time=0,last=performance.now(),paused=false;
const grid=document.querySelector('#grid'),phase=document.querySelector('#phase'),zoom=document.querySelector('#zoom'),view=document.querySelector('#view'),region=document.querySelector('#region');
fetch('manifest.json').then(r=>{if(!r.ok)throw Error('图鉴数据加载失败');return r.json()}).then(m=>{const entries=Object.entries(m.enemies).sort((a,b)=>(b[1].role==='boss')-(a[1].role==='boss'));let frames=0;for(const[id,e]of entries){frames+=Object.values(e.states).reduce((n,s)=>n+s.frames.length,0);const a=document.createElement('article');a.className=e.role==='boss'?'boss':'';const tag=document.createElement('div');tag.className='tag';tag.textContent=e.role==='boss'?'BOSS · '+regions[e.region]:regions[e.region];const box=document.createElement('div');box.className='stage';const canvas=document.createElement('canvas');canvas.width=e.width;canvas.height=e.height;canvas.setAttribute('aria-label',e.title+'动画');box.append(canvas);const title=document.createElement('h2');title.textContent=e.title;const detail=document.createElement('div');detail.className='details';const icon=new Image();icon.src=id+'/salvage.png';icon.className='part';icon.alt='拆解零件';detail.append(icon,document.createTextNode(roles[e.role]+' · '+e.english_title));a.append(tag,box,title,detail);grid.append(a);cards.push({a,id,e,canvas,ctx:canvas.getContext('2d'),images:{}})}document.querySelector('#summary').textContent=entries.length+' 种怪物 · '+frames+' 张原生动画帧';filter();}).catch(e=>document.querySelector('#error').textContent=e.message);
function filter(){document.body.dataset.view=view.value;for(const c of cards)c.a.hidden=(view.value==='boss'&&c.e.role!=='boss')||(view.value==='normal'&&c.e.role==='boss')||(region.value!=='all'&&region.value!==c.e.region)}
function tick(now){if(!paused)time+=(now-last)/1000;last=now;for(const c of cards){if(c.a.hidden)continue;const v=phase.value==='2'&&c.e.states[variants[state]]?variants[state]:state,d=c.e.states[v];if(!d)continue;let im=c.images[v];if(!im){im=c.images[v]=new Image();im.src=c.id+'/'+v+'.png';im.onerror=()=>document.querySelector('#error').textContent='动画资源加载失败：'+c.id+'/'+v}const n=d.frames.length,raw=Math.floor(time*d.fps),f=d.loop?raw%n:Math.min(raw%(n+Math.ceil(d.fps*.65)),n-1),w=c.e.width,h=c.e.height;c.ctx.clearRect(0,0,w,h);c.ctx.imageSmoothingEnabled=false;const scale=zoom.value==='game'?c.e.render_scale:1,css=zoom.value==='2'?2:1;c.canvas.style.width=w*css+'px';c.canvas.style.height=h*css+'px';if(im.complete&&im.naturalWidth){const ax=c.e.anchor[0],ay=c.e.anchor[1];c.ctx.drawImage(im,(f%d.columns)*w,Math.floor(f/d.columns)*h,w,h,Math.round(w/2-ax*scale),Math.round(h-14-ay*scale),w*scale,h*scale)}}requestAnimationFrame(tick)}requestAnimationFrame(tick);
for(const b of document.querySelectorAll('[data-state]'))b.onclick=()=>{state=b.dataset.state;time=0;for(const x of document.querySelectorAll('[data-state]'))x.setAttribute('aria-pressed',String(x===b))};document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'播放':'暂停'};view.onchange=filter;region.onchange=filter;phase.onchange=()=>time=0;
</script></html>
